name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    name: Build (Release x64)
    # windows-2022 已内置 .NET Framework 4.7.2 Targeting Pack，无需额外安装。
    # 如需跟随最新镜像可改为 windows-latest（2025 镜像同样自带 4.7.2 目标包）。
    runs-on: windows-2022

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 安装 NuGet
        uses: nuget/setup-nuget@v2

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原 NuGet 包
        run: nuget restore FF14TreasureHunterACT.sln

      # 编译需要引用 ACT 的 exe，但 ACT 不在仓库里（体积大、不宜分发），
      # 官网也无法稳定下载。所以用 _ci/act-stub 生成一个「身份相同」的引用桩。
      - name: 构建 ACT 引用桩
        run: dotnet build _ci/act-stub/ActStub.csproj -c Release -v:minimal

      - name: 编译插件
        run: >
          msbuild FF14TreasureHunterACT.sln
          /t:Rebuild
          /p:Configuration=Release
          /p:Platform=x64
          /p:ActDir="${{ github.workspace }}\_ci\act-stub\bin\Release\net472"
          /v:minimal
          /nologo

      # 校验逻辑放在 _ci/verify-ref.ps1，本地与 CI 共用同一份实现。
      # 注意：脚本内不要用 ReflectionOnlyLoadFrom —— PowerShell 7 不支持，
      # 具体说明见脚本头部注释。
      - name: 校验产物与引用完整性
        shell: pwsh
        run: ./_ci/verify-ref.ps1

      # 仅打 tag 时校验 tag 与程序集版本一致，避免发错版本
      - name: 校验 tag 与程序集版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = "FF14TreasureHunterACT\bin\x64\Release\FF14TreasureHunterACT.dll"
          $asmVer = [System.Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $dll)).Version.ToString()
          $tagVer = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "tag = $tagVer"
          Write-Host "程序集 = $asmVer"
          if ($asmVer -ne $tagVer) {
            throw "version mismatch: tag=$tagVer, assembly=$asmVer. 请先修改 AssemblyInfo.cs 的 AssemblyVersion 再打 tag"
          }

      - name: 打包网页文件
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path web\* -DestinationPath web-pages.zip -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: FF14TreasureHunterACT-${{ github.ref_name }}
          path: |
            FF14TreasureHunterACT/bin/x64/Release/FF14TreasureHunterACT.dll
            web-pages.zip
          if-no-files-found: error

      - name: 创建或更新 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $dll = "FF14TreasureHunterACT\bin\x64\Release\FF14TreasureHunterACT.dll"

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag 不存在，创建中..."
            gh release create $tag --title "挖宝会计 $tag" --generate-notes
          } else {
            Write-Host "Release $tag 已存在，将覆盖附件"
          }

          gh release upload $tag $dll --clobber
          if (Test-Path web-pages.zip) {
            gh release upload $tag web-pages.zip --clobber
          }

          Write-Host "✓ Release 发布完成"
          gh release view $tag