name: 功能建议
description: 想要新功能或改进现有功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议！请重点说明**使用场景**，这样更容易判断值不值得做。

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有重复建议
          required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这个功能？现在的做法有什么不便？
      placeholder: |
        例如：我一车要打 20 张图，中途换人时想按人分别统计，
        现在只能手动分段再心算。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的效果
      description: 你希望功能长什么样、怎么操作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现在你是怎么绕过这个问题的？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 数据统计（地图/魔纹/出货/层级）
        - 成本与工资
        - 分段结算
        - 结果预测
        - 自动发送 / 鲶鱼精
        - 网页面板 / 悬浮窗
        - 设置页
        - 其他
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考的其他工具等
    validations:
      required: false
